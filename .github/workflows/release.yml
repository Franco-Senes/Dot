name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-flatpak:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate metadata
        run: |
          desktop-file-validate data/dev.senes.Dot.desktop
          appstreamcli validate --no-net data/dev.senes.Dot.metainfo.xml

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: dev.senes.Dot.flatpak
          manifest-path: build-aux/flatpak/dev.senes.Dot.yml
          cache-key: flatpak-release-${{ github.ref_name }}

      - name: Generate SHA-256 checksums
        run: sha256sum dev.senes.Dot.flatpak > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dev.senes.Dot.flatpak
            SHA256SUMS.txt
          generate_release_notes: true
