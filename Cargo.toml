[workspace]
resolver = "2"
members = [
    "crates/gnome-platform",
    "crates/dot-core",
    "crates/dot",
    "crates/dot-bench",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Office Commun", "Dot contributors"]
repository = "https://github.com/driceroland/Search"

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
bitflags = "2"
cef = { version = "156.6.0", default-features = false }
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
flate2 = "1"
form_urlencoded = "1"
idna = "1"
indexmap = "2"
libc = "0.2"
memchr = "2"
once_cell = "1"
percent-encoding = "2"
regex = "1"
ring = "0.17"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
thiserror = "2"
time = "0.3"
url = "2"
zeroize = "1"

gnome-platform = { path = "crates/gnome-platform" }
dot-core = { path = "crates/dot-core" }
